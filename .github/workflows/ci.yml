name: CI

on:
  push:
    branches:
      - main
      - ci-*
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        working-directory: backend
        run: |
          ruff --version
          ruff check .

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kimiti-ai-assistant-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Lint
        run: |
          npm run lint --silent

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          VECTOR_BACKEND: memory
          OPENAI_API_KEY: dummy
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest -q backend/tests

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: kimiti-ai-assistant-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Build
        run: |
          npm run build

  docker-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/kimitiai-backend:ci
          platforms: linux/amd64

  docker-publish-backend:
    name: Publish Backend Docker Image (GHCR)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kimitiai-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kimitiai-backend:latest
          platforms: linux/amd64

  integration:
    name: Integration (DB/Redis/Qdrant)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      db:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kimiti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kimiti" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for services
        run: |
          python - << 'PY'
          import socket, time, sys
          def wait(host, port, name):
              s = socket.socket()
              for i in range(120):
                  try:
                      s.connect((host, port)); s.close(); return
                  except OSError:
                      time.sleep(1)
              print(f"{name} not reachable on {host}:{port}")
              sys.exit(1)
          wait('localhost', 5432, 'Postgres')
          wait('localhost', 6379, 'Redis')
          wait('localhost', 6333, 'Qdrant')
          PY

      - name: Run migrations
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kimiti
        run: |
          alembic upgrade head

      - name: Run integration tests
        env:
          VECTOR_BACKEND: pgvector
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kimiti
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: dummy
        run: |
          pytest -q backend/tests
