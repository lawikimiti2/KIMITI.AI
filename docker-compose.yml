version: "3.9"
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').getcode()==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - kimiti

  frontend:
    build: ./kimiti-ai-assistant-main
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - kimiti

  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kimiti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kimiti"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - kimiti

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - kimiti

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - kimiti

  worker:
    build: ./backend
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    networks:
      - kimiti

networks:
  kimiti:
    driver: bridge

volumes:
  pgdata:
  qdrantdata:
